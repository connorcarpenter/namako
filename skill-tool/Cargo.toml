[package]
name = "skill-tool"
version = "0.1.0"
edition = "2021"
description = "Codex skill management CLI (Rust port of Python skill scripts)"

[[bin]]
name = "skill-tool"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
zip = "2"
ureq = { version = "2", features = ["json"] }
walkdir = "2.5"
anyhow = "1.0"
tempfile = "3"
url = "2"
dirs = "5"
