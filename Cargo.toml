[workspace]
members = ["engine", "codegen", "cli", "benches", "skill-tool"]
resolver = "3"

# Kingdom shared Rust lint set, rungs 1-4 (ambry standards/RUST_LINTS.md).
# Copied, never inherited across repos; every member says `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"
allow_attributes_without_reason = "deny"
